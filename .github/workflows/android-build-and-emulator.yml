name: Android build and emulator smoke test

on:
  push:
    paths:
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Reconstruct source ZIP from upload chunks
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'bootstrap/source-*.b64' > /dev/null; then
            cat bootstrap/source-*.b64 | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/ChannelOnly-source.zip"
            unzip -t "$RUNNER_TEMP/ChannelOnly-source.zip"
            mkdir -p ChannelOnly
            unzip -q "$RUNNER_TEMP/ChannelOnly-source.zip" -d ChannelOnly

            # Apply verified compiler fixes to the reconstructed source.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ChannelOnly")
          build = root / "build.gradle.kts"
          text = build.read_text()
          text = text.replace('version "2.1.21"', 'version "2.3.0"')
          text = text.replace('version "2.1.21" apply false', 'version "2.3.0" apply false')
          # This project uses the plugins DSL, whose root lines are explicit versions.
          text = text.replace('version "2.1.21"', 'version "2.3.0"')
          text = text.replace('version "2.1.21" apply false', 'version "2.3.0" apply false')
          build.write_text(text)
          
          api = root / "app/src/main/java/com/cube/channelonly/data/YouTubeApi.kt"
          source = api.read_text()
          old = '        all.distinctBy { it.channelId }'
          assert source.count(old) == 1, "expected exactly one subscription list return"
          source = source.replace(old, '        return all.distinctBy { it.channelId }', 1)
          
          start = source.index("    suspend fun searchChannels(")
          end = source.index("    suspend fun subscribe(", start)
          section = source[start:end]
          assert section.count("        buildList {") == 1, "expected one searchChannels builder"
          section = section.replace("        buildList {", "        return buildList {", 1)
          source = source[:start] + section + source[end:]
          
          old = '        filterSubscribedVideos(videos, allowedIds).sortedByDescending { it.publishedAt }'
          assert source.count(old) == 1, "expected exactly one feed result"
          source = source.replace(old, '        return filterSubscribedVideos(videos, allowedIds).sortedByDescending { it.publishedAt }', 1)
          api.write_text(source)
          PY
            # Publish the repaired source tree at the repository root, leaving the CI workflow intact.
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='local.properties' ChannelOnly/ ./
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat .gitignore local.properties.example player-origin-site
            if ! git diff --cached --quiet; then
              git commit -m "Add ChannelOnly source and fix Kotlin compilation"
              git push origin HEAD:main
            fi
            echo "PROJECT_DIR=ChannelOnly" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Verify Android source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::Missing app/build.gradle.kts"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "::error::Missing AndroidManifest.xml"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/java/com/cube/channelonly/MainActivity.kt" || { echo "::error::Missing MainActivity.kt"; exit 1; }

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools" || { echo "::error::Android SDK command-line tools not found at $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager executable not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:testDebugUnitTest :app:assembleDebug

      - name: Launch app in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am force-stop com.cube.channelonly || true
            adb shell am start -W -n com.cube.channelonly/.MainActivity
            sleep 5
            adb shell pidof com.cube.channelonly
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com\\.cube\\.channelonly'; then
              echo 'Detected an app crash in emulator logcat.'
              exit 1
            fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: channelonly-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
