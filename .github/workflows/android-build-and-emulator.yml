name: Android build and emulator smoke test

on:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-build-and-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify Android source is present
        run: |
          test -f app/build.gradle.kts || { echo "::error::Missing app/build.gradle.kts. Upload the ChannelOnly source bundle to the repository root first."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::Missing AndroidManifest.xml."; exit 1; }
          test -f app/src/main/java/com/cube/channelonly/MainActivity.kt || { echo "::error::Missing MainActivity.kt."; exit 1; }

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Launch app in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.cube.channelonly || true
            adb shell am start -W -n com.cube.channelonly/.MainActivity
            sleep 5
            adb shell pidof com.cube.channelonly
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com\\.cube\\.channelonly'; then
              echo 'Detected an app crash in emulator logcat.'
              exit 1
            fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: channelonly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
