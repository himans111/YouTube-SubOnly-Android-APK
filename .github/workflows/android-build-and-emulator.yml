name: Android build and emulator smoke test

on:
  push:
    paths:
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Use committed project sources
        run: echo "PROJECT_DIR=." >> "$GITHUB_ENV"

      - name: Verify Android source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::Missing app/build.gradle.kts"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "::error::Missing AndroidManifest.xml"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/java/com/cube/channelonly/MainActivity.kt" || { echo "::error::Missing MainActivity.kt"; exit 1; }

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools" || { echo "::error::Android SDK command-line tools not found at $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager executable not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channelonly-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create and boot a lightweight Android emulator
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/.android/avd
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_AVD_HOME"
          export ANDROID_AVD_HOME
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/avdmanager' | sort -V | tail -n 1)"
          test -x "$AVDMANAGER" || { echo "::error::avdmanager executable not found"; exit 1; }
          printf 'no\n' | "$AVDMANAGER" create avd --force --name channelonly_ci --package "system-images;android-30;google_apis;x86_64" --device pixel_2
          nohup "$SDK_ROOT/emulator/emulator" -avd channelonly_ci -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -camera-back none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$RUNNER_TEMP/emulator.pid"
          export ANDROID_SERIAL=emulator-5554
          adb start-server

          dump_diagnostics() {
            echo "---- emulator process ----"
            ps -fp "$EMULATOR_PID" || true
            echo "---- emulator output ----"
            cat "$RUNNER_TEMP/emulator.log" || true
            echo "---- adb devices ----"
            adb devices -l || true
            adb -s "$ANDROID_SERIAL" shell getprop > "$RUNNER_TEMP/boot-properties.txt" 2>&1 || true
            adb -s "$ANDROID_SERIAL" logcat -d -t 3000 > "$RUNNER_TEMP/logcat.txt" 2>&1 || true
          }

          deadline=$((SECONDS + 600))
          until adb -s "$ANDROID_SERIAL" get-state >/dev/null 2>&1; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              dump_diagnostics
              echo "::error::Android emulator process exited before ADB became available"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              dump_diagnostics
              echo "::error::ADB device did not become available within 10 minutes"
              exit 1
            fi
            sleep 5
          done

          until [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              dump_diagnostics
              echo "::error::Android emulator process exited before boot completed"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              dump_diagnostics
              echo "::error::Emulator did not complete boot within 10 minutes"
              exit 1
            fi
            sleep 5
          done

          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0 || true
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0 || true
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0 || true
          echo "Emulator boot completed."

      - name: Install, launch, and inspect app in emulator
        shell: bash
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb -s "$ANDROID_SERIAL" install -r "$APK"
          adb -s "$ANDROID_SERIAL" shell am force-stop com.cube.channelonly || true
          adb -s "$ANDROID_SERIAL" shell am start -n com.cube.channelonly/.MainActivity
          sleep 10
          PID="$(adb -s "$ANDROID_SERIAL" shell pidof com.cube.channelonly | tr -d '\r')"
          if [ -z "$PID" ]; then
            adb -s "$ANDROID_SERIAL" logcat -d -t 5000 > "$RUNNER_TEMP/logcat.txt" || true
            cat "$RUNNER_TEMP/logcat.txt"
            echo "::error::App process did not remain alive after launch"
            exit 1
          fi
          adb -s "$ANDROID_SERIAL" logcat -d -t 5000 > "$RUNNER_TEMP/logcat.txt"
          if grep -qE 'FATAL EXCEPTION|Process: com[.]cube[.]channelonly' "$RUNNER_TEMP/logcat.txt"; then
            cat "$RUNNER_TEMP/logcat.txt"
            echo "::error::Detected an app crash in emulator logcat"
            exit 1
          fi
          echo "Emulator smoke test passed; app process PID: $PID"

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: channelonly-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/emulator.pid
            ${{ runner.temp }}/boot-properties.txt
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore
          retention-days: 7
